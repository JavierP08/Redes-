<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subnetting paso a paso</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6fa;--card:#fff;--ink:#14213d;--mut:#5b6b85;--teal:#0a8a8f;--hl:#ffe45c;--hlink:#14213d;--bad:#c0392b;--ok:#1e8e4e;--line:#d5deea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1726;--card:#18233a;--ink:#e8eef9;--mut:#9aabc7;--teal:#3cc4c9;--hl:#6b5d10;--hlink:#fff3a8;--bad:#ff8a7a;--ok:#5fd38d;--line:#2c3b57}}
:root[data-theme="dark"]{--bg:#0f1726;--card:#18233a;--ink:#e8eef9;--mut:#9aabc7;--teal:#3cc4c9;--hl:#6b5d10;--hlink:#fff3a8;--bad:#ff8a7a;--ok:#5fd38d;--line:#2c3b57}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px;color:var(--teal)}
h2{font-size:1.1rem;margin:0 0 8px}
.sub{color:var(--mut);margin:0 0 16px}
.enun{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--teal);padding:14px 16px;border-radius:6px;margin-bottom:14px}
.enun b{font-family:"IBM Plex Mono",monospace}
.prog{display:flex;gap:6px;margin-bottom:14px}
.prog span{flex:1;height:8px;border-radius:4px;background:var(--line)}
.prog .on{background:var(--teal)}.prog .perfect{background:var(--ok)}.prog .help{background:#e0a800}.prog .rev{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px}
.theory{margin:0 0 12px;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mut);gap:3px;flex:1 1 180px}
input{font:1rem "IBM Plex Mono",monospace;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--teal);outline-offset:1px}
button{font:600 1rem "IBM Plex Sans",sans-serif;padding:10px 18px;border:0;border-radius:4px;background:var(--teal);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button{color:#0f1726}}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.hints{margin:12px 0 0;padding:0;list-style:none}
.hints li{background:var(--bg);border-left:4px solid #e0a800;padding:8px 12px;margin-bottom:8px;border-radius:0 4px 4px 0}
.msg{margin:8px 0 0;font-weight:600}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.sol{background:var(--bg);border-radius:4px;padding:10px 12px;margin-top:10px}
.strip{font-family:"IBM Plex Mono",monospace;overflow-x:auto;white-space:nowrap;padding:6px 0;font-size:1.05rem}
.strip .o{display:inline-block;margin-right:.7ch}
.r{border-bottom:3px solid var(--teal)}
.h{background:var(--hl);color:var(--hlink)}
.leg{font-size:.85rem;color:var(--mut)}
.done{border-left:5px solid var(--ok)}
code{font-family:"IBM Plex Mono",monospace}
.hero{background:#14213d;color:#fff;border-radius:10px;padding:18px 18px 14px;margin-bottom:16px;border-bottom:6px solid #ffe45c}
.hero h1{color:#fff;font-size:1.7rem}.hero .sub{color:#c5d3ea;margin-bottom:10px}
.bits{font:600 clamp(.95rem,4.2vw,1.6rem) "IBM Plex Mono",monospace;color:#5fd6da;margin-bottom:6px;overflow:hidden;white-space:nowrap}
.bits b{background:#ffe45c;color:#14213d;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
#lvb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-height:34px}
.badge{background:#ffe45c;color:#14213d;font-weight:600;padding:4px 12px;border-radius:99px}
:root button.sec{color:var(--ink)}
:root #lvb button.sec{color:#fff;border-color:#5b6b85;padding:6px 12px;font-size:.9rem}
.pick{font-size:1.3rem}
.lv{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-bottom:12px}
:root button.lvc{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-top:10px solid;padding:16px;font-weight:400;transition:transform .15s}
.lvc:hover{transform:translateY(-4px)}.lvc b{font-size:1.3rem}.lvc .em{font-size:2rem}
:root button.lvc.g{border-top-color:#2ea66b}:root button.lvc.y{border-top-color:#e0a800}:root button.lvc.r{border-top-color:#d9473a}
.blk{display:flex;gap:4px;margin-bottom:14px;font:600 .8rem "IBM Plex Mono",monospace}
.sg{padding:8px 10px;border-radius:4px;color:#14213d;min-width:0;overflow-wrap:anywhere}
.sg small{display:block;font:600 .75rem "IBM Plex Sans",sans-serif}
.sg.a{background:#5fd6da;flex:1}.sg.b{background:#ffe45c;flex:3}.sg.c{background:#ff9a8c;flex:1}
.sg.lk{background:var(--line);color:var(--mut)}
.pow{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}.pow span{border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-family:"IBM Plex Mono",monospace;text-align:center}.pow b{display:block;font-size:.75rem;color:var(--mut)}
.pop{animation:pop .5s}@keyframes pop{40%{transform:scale(1.03);border-color:var(--ok)}}
.stars{font-size:2rem}
button:disabled{opacity:.5;cursor:default}
#cres ul{list-style:none;padding:0;margin:12px 0}#cres li{padding:8px 12px;margin-bottom:8px;border-left:4px solid;border-radius:0 4px 4px 0;background:var(--bg)}
.cok{border-color:var(--ok)}.cbad{border-color:var(--bad)}
:root button.lvc.c{border-top-color:#0a8a8f}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<div class="hero"><div class="bits" aria-hidden="true">11000000.10101000.00000001.1<b>0000000</b></div><h1>Subnetting paso a paso</h1><p class="sub">Resuelve cada paso. Si fallas, recibes hasta tres pistas antes de ver la solución.</p><div id="lvb"></div></div>
<div id="app"></div>
</main>
<script>
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const fromI=i=>[i>>>24,(i>>>16)&255,(i>>>8)&255,i&255];
const toI=a=>((a[0]<<24)|(a[1]<<16)|(a[2]<<8)|a[3])>>>0;
const ipS=a=>a.join('.');
const b8=x=>x.toString(2).padStart(8,'0');
const bin=a=>a.map(b8).join('.');
const pIP=s=>{s=(s||'').trim();if(!/^\d{1,3}(\.\d{1,3}){3}$/.test(s))return null;const a=s.split('.').map(Number);return a.some(x=>x>255)?null:a};
const pN=s=>{s=(s||'').trim().replace(/^\//,'');return /^\d+$/.test(s)?+s:null};
const eqIP=(s,a)=>{const x=pIP(s);return !!x&&ipS(x)===ipS(a)};
function strip(a,p){let h='';for(let o=0;o<4;o++){h+='<span class="o">';for(let b=0;b<8;b++){const i=o*8+b;h+=`<span class="${i<p?'r':'h'}">${(a[o]>>(7-b))&1}</span>`}h+='</span>'}return `<div class="strip">${h}</div>`}
const LEG='<div class="leg"><span class="r">subrayado</span> = bits de red · <span class="h">resaltado</span> = bits de host</div>';
let E,S,ST;
function newEx(L){
  const n=L===1?rnd(3,6):L===2?rnd(3,10):rnd(6,16),h=rnd(2**(n-1)-1,2**n-2),p=32-n;
  const mi=(0xFFFFFFFF<<n)>>>0;
  const c=((192<<24)|(168<<16)|rnd(0,65535))>>>0;
  const base=L===3?[c,((10<<24)|rnd(0,16777215))>>>0,((172<<24)|((16+rnd(0,15))<<16)|rnd(0,65535))>>>0][rnd(0,2)]:c;
  const net=(base&mi)>>>0;
  const bc=(net|(~mi>>>0))>>>0;
  E={L,n,h,p,k:Math.min(3,Math.floor(p/8)),net:fromI(net),mask:fromI(mi),bc:fromI(bc),first:fromI(net+1),last:fromI(bc-1),ip:fromI(net+rnd(1,2**n-2))};
  ST=L===3?[steps[0],steps[1],netStep,steps[2],steps[3]]:steps;
  S={i:0,tries:ST.map(()=>0),hints:ST.map(()=>[]),res:[],vals:ST.map(()=>({})),msg:''};
}
const steps=[
 {k:'n',t:'Calcular n (bits de host)',
  th:()=>'Busca el menor n tal que 2<sup>n</sup> − 2 ≥ nº de hosts. Se restan 2 porque la primera dirección es la de red y la última la de broadcast.',
  f:[{id:'n',l:'n (bits de host)',ph:'ej. 5'}],
  ok:v=>pN(v.n)===E.n,
  hs:[()=>`Necesitas 2<sup>n</sup> − 2 ≥ ${E.h}. Recuerda restar las direcciones de red y de broadcast.`,
   v=>{const n=pN(v.n);return n===null?`Prueba un valor de n y calcula 2<sup>n</sup> − 2: tiene que ser ≥ ${E.h}, sin pasarte de bits.`:n<E.n?`Con n = ${n} solo tienes 2<sup>${n}</sup> − 2 = ${2**n-2} hosts: no llegas a ${E.h}. Necesitas más bits.`:`Con n = ${n} llegas (${2**n-2} hosts), pero desperdicias direcciones. Busca el n más pequeño que sirva.`},
   ()=>`El resultado está entre ${E.n-1} y ${E.n+1}. Calcula 2<sup>n</sup> − 2 para cada uno y quédate con el primero que llega a ${E.h}.`],
  ans:()=>`n = ${E.n}`,
  ex:()=>`2<sup>${E.n}</sup> − 2 = ${2**E.n-2} ≥ ${E.h}, y con n = ${E.n-1} serían solo ${2**(E.n-1)-2} &lt; ${E.h}.`},
 {k:'mask',t:'Crear la máscara de red',
  th:()=>`Pon a 0 los n = ${E.n} bits de host (de derecha a izquierda) y a 1 el resto, que son los bits de red. El prefijo /x es el número de unos.`,
  f:[{id:'p',l:'Prefijo',ph:'/24'},{id:'m',l:'Máscara en decimal',ph:'255.255.255.0'}],
  ok:v=>pN(v.p)===E.p&&eqIP(v.m,E.mask),
  hs:[()=>`La máscara tiene ${E.n} ceros al final y el resto unos. El prefijo es 32 − ${E.n}.`,
   ()=>`Tu máscara debe tener ${E.p} unos seguidos de ${E.n} ceros. Los octetos de todo unos valen 255 y los de todo ceros valen 0.`,
   ()=>`En binario es ${bin(E.mask)}. El octeto ${E.k+1} es ${b8(E.mask[E.k])}: súmale los pesos 128, 64, 32… a cada 1 para pasarlo a decimal.`],
  ans:()=>`/${E.p} = ${ipS(E.mask)}`,
  ex:()=>`${strip(E.mask,E.p)}Binario ${bin(E.mask)} = ${ipS(E.mask)} = /${E.p}.`},
 {k:'bc',t:'Calcular la dirección de broadcast',
  th:()=>`La red es <code>${ipS(E.net)}</code>. Deja intactos los bits de red y pon a 1 todos los bits de host.`,
  f:[{id:'b',l:'Dirección de broadcast',ph:'192.168.1.127'}],
  ok:v=>eqIP(v.b,E.bc),
  hs:[()=>`Los bits de red no se tocan y los n = ${E.n} bits de host se ponen todos a 1.`,
   ()=>`La red en binario es ${bin(E.net)}. Mantén los primeros ${E.p} bits y cambia los últimos ${E.n} a 1.`,
   ()=>`Atajo: broadcast = red + (2<sup>${E.n}</sup> − 1) = red + ${2**E.n-1} direcciones. Suma desde el octeto de la derecha, con acarreo si pasas de 255.`],
  ans:()=>ipS(E.bc),
  ex:()=>`Red: ${strip(E.net,E.p)}Broadcast: ${strip(E.bc,E.p)}${LEG}= ${ipS(E.bc)}`},
 {k:'range',t:'Calcular el rango de hosts',
  th:()=>`Los hosts son todas las direcciones entre la de red (<code>${ipS(E.net)}</code>) y la de broadcast (<code>${ipS(E.bc)}</code>), sin incluirlas.`,
  f:[{id:'f',l:'Primer host',ph:'192.168.1.1'},{id:'l',l:'Último host',ph:'192.168.1.126'}],
  ok:v=>eqIP(v.f,E.first)&&eqIP(v.l,E.last),
  hs:[()=>'La dirección de red y la de broadcast no se pueden asignar a equipos, así que quedan fuera del rango.',
   ()=>`Primer host = dirección de red + 1 = ${ipS(E.net)} + 1.`,
   ()=>`Último host = broadcast − 1 = ${ipS(E.bc)} − 1. Entre ambos hay ${2**E.n-2} hosts, justo lo que pide el enunciado (≥ ${E.h}).`],
  ans:()=>`${ipS(E.first)} – ${ipS(E.last)}`,
  ex:()=>`Del ${ipS(E.first)} (red + 1) al ${ipS(E.last)} (broadcast − 1): ${2**E.n-2} hosts útiles.`}
];
const netStep={k:'net',t:'Calcular la dirección de red',
 th:()=>`Te dan el equipo <code>${ipS(E.ip)}</code>. La dirección de red sale de un AND bit a bit entre la IP y la máscara <code>${ipS(E.mask)}</code>: los bits de host pasan a 0.`,
 f:[{id:'r',l:'Dirección de red',ph:'10.0.0.0'}],
 ok:v=>eqIP(v.r,E.net),
 hs:[()=>'En el AND, 1 AND x = x y 0 AND x = 0. Donde la máscara tiene ceros, el resultado es 0.',
  ()=>`Los octetos con máscara 255 se copian tal cual. Fíjate en el octeto ${E.k+1}: IP = ${b8(E.ip[E.k])}, máscara = ${b8(E.mask[E.k])}.`,
  ()=>`Pon a 0 los últimos ${E.n} bits de ${bin(E.ip)}. Los octetos con máscara 0 valen 0.`],
 ans:()=>ipS(E.net),
 ex:()=>`IP: ${strip(E.ip,E.p)}Red: ${strip(E.net,E.p)}${LEG}= ${ipS(E.net)}`};
function menu(){
 const L=[[1,'🌱','Fácil','Hasta 62 hosts, redes 192.168.x.x y una tabla de potencias de 2 como ayuda.','g'],[2,'🔧','Medio','Hasta 1022 hosts y sin tabla de ayuda.','y'],[3,'🔥','Difícil','Hasta 65 534 hosts, redes 10.x, 172.16.x y 192.168.x. Te dan la IP de un equipo y tú calculas también la dirección de red.','r'],[0,'✅','Corrector','Escribe un ejercicio y tus respuestas: te digo qué está bien, qué falla y por qué.','c']];
 document.getElementById('app').innerHTML='<h2 class="pick">Elige un nivel o corrige tu propio ejercicio</h2><div class="lv">'+L.map(l=>`<button class="lvc ${l[4]}" data-l="${l[0]}"><span class="em">${l[1]}</span><b>${l[2]}</b><span>${l[3]}</span></button>`).join('')+'</div><p class="leg">Puedes cambiar de nivel cuando quieras.</p>';
 document.querySelectorAll('.lvc').forEach(b=>b.onclick=()=>{const l=+b.dataset.l;if(!l){CM=true;render();return}CM=false;newEx(l);render()});
}
function bar(){
 const d=k=>ST.some((s,i)=>s.k===k&&S.res[i]);
 const no=E.L<3||d('net');
 return `<div class="blk"><div class="sg a ${no?'':'lk'}"><small>Red</small>${no?ipS(E.net):'?'}</div><div class="sg b ${d('range')?'':'lk'}"><small>Hosts${d('n')?' ('+(2**E.n-2)+' útiles)':''}</small>${d('range')?ipS(E.first)+' – '+ipS(E.last):'?'}</div><div class="sg c ${d('bc')?'':'lk'}"><small>Broadcast</small>${d('bc')?ipS(E.bc):'?'}</div></div>`;
}
const pow=()=>'<div class="pow">'+[1,2,3,4,5,6,7,8].map(x=>`<span><b>2<sup>${x}</sup></b>${2**x}</span>`).join('')+'</div>';
function render(){
  const lb=document.getElementById('lvb');
  if(!E){lb.innerHTML=CM?'<span class="badge">✅ Corrector</span><button class="sec" id="chl">Volver al menú</button>':'';if(CM){document.getElementById('chl').onclick=()=>{CM=false;render()};corrector()}else menu();return}
  const a=document.getElementById('app');let h='';
  lb.innerHTML=`<span class="badge">${['','🌱 Fácil','🔧 Medio','🔥 Difícil'][E.L]}</span><button class="sec" id="chl">Cambiar nivel</button>`;
  document.getElementById('chl').onclick=()=>{E=null;render()};
  h+=E.L===3?`<div class="enun">Un equipo tiene la IP <b>${ipS(E.ip)}</b>. Su subred debe direccionar <b>${E.h}</b> equipos.</div>`:`<div class="enun">Red <b>${ipS(E.net)}</b>. Necesitas direccionar <b>${E.h}</b> equipos.</div>`;
  h+='<div class="prog">'+ST.map((s,i)=>`<span class="${S.res[i]||(i===S.i?'on':'')}" title="Paso ${i+1}"></span>`).join('')+'</div>'+bar();
  for(let i=0;i<=Math.min(S.i,ST.length-1);i++){
    const s=ST[i],done=S.res[i];
    h+=`<section class="card ${done?'done':''} ${done&&i===S.i?'pop':''}"><h2>Paso ${i+1}: ${s.t}</h2><p class="theory">${s.th()}</p>${E.L===1&&s.k==='n'&&!done?pow():''}`;
    if(done){
      h+=`<div class="sol"><b>${{perfect:'⭐ Correcto',help:'👍 Correcto con ayuda',rev:'💡 Solución'}[done]}: ${s.ans()}</b><br>${s.ex()}</div>`;
    }else{
      h+='<div class="row">'+s.f.map(f=>`<label>${f.l}<input id="in-${f.id}" autocomplete="off" inputmode="text" placeholder="${f.ph}" value="${S.vals[i][f.id]||''}"></label>`).join('')+'</div>';
      h+=`<button id="chk">Comprobar</button> <button class="sec" id="hnt" ${S.hints[i].length>=3?'disabled':''}>💡 Pedir pista</button> <span class="leg">Pistas usadas: ${S.hints[i].length} de 3</span>`;
      if(S.msg)h+=`<p class="msg bad">${S.msg}</p>`;
    }
    if(S.hints[i].length)h+='<ul class="hints">'+S.hints[i].map((t,j)=>`<li><b>Pista ${j+1}:</b> ${t}</li>`).join('')+'</ul>';
    h+='</section>';
  }
  if(S.res.length===ST.length){
    const g=S.res.filter(r=>r==='perfect').length,hp=S.res.filter(r=>r==='help').length,rv=S.res.filter(r=>r==='rev').length;
    h+=`<section class="card"><h2>🏁 Ejercicio completado</h2><div class="stars">${'⭐'.repeat(g)}${'👍'.repeat(hp)}${'💡'.repeat(rv)}</div><p>Sin ayuda: <b>${g}</b> · Con pistas: <b>${hp}</b> · Solución revelada: <b>${rv}</b></p><button id="next">Nuevo ejercicio</button> <button class="sec" id="chl2">Cambiar nivel</button></section>`;
  }else if(S.res[S.i]){
    h+='<button id="adv">Siguiente paso</button>';
  }
  a.innerHTML=h;
  const c=document.getElementById('chk');
  if(c){c.onclick=check;document.getElementById('hnt').onclick=hint;a.querySelectorAll('input').forEach(x=>x.onkeydown=e=>{if(e.key==='Enter')check()});a.querySelector('input').focus({preventScroll:true})}
  const ad=document.getElementById('adv');if(ad)ad.onclick=()=>{S.i++;S.msg='';render()};
  const nx=document.getElementById('next');if(nx){nx.onclick=()=>{newEx(E.L);render()};document.getElementById('chl2').onclick=()=>{E=null;render()}}
}
let CM=false;
function hint(){const i=S.i,s=ST[i],v={};s.f.forEach(f=>v[f.id]=document.getElementById('in-'+f.id).value);S.vals[i]=v;if(S.hints[i].length<3)S.hints[i].push(s.hs[S.hints[i].length](v));S.msg='';render()}
const CF=[['n','n (bits de host)'],['p','Prefijo'],['m','Máscara'],['r','Dirección de red'],['b','Broadcast'],['f','Primer host'],['l','Último host']];
function corrector(){
 document.getElementById('app').innerHTML=`<section class="card"><h2>Corrector de ejercicios</h2><p class="theory">Escribe el enunciado y tus respuestas. Deja en blanco lo que no hayas hecho: te diré qué está bien, qué falla y por qué.</p><div class="row"><label>IP o red del enunciado<input id="c-ip" placeholder="192.168.1.0"></label><label>Equipos a direccionar<input id="c-h" inputmode="numeric" placeholder="68"></label></div><h2>Tus respuestas</h2><div class="row">${CF.map(f=>`<label>${f[1]}<input id="c-${f[0]}" autocomplete="off"></label>`).join('')}</div><button id="cc">Corregir</button><div id="cres"></div></section>`;
 document.getElementById('cc').onclick=correct;
}
function correct(){
 const g=id=>document.getElementById('c-'+id).value.trim(),out=document.getElementById('cres');
 const ip=pIP(g('ip')),h=pN(g('h'));
 if(!ip||!h||h<1||h>2**30-2){out.innerHTML='<p class="msg bad">Escribe una IP válida (ej. 192.168.1.0) y un número de equipos entre 1 y 1 073 741 822.</p>';return}
 let n=2;while(2**n-2<h)n++;
 const p=32-n,mi=(0xFFFFFFFF<<n)>>>0,net=(toI(ip)&mi)>>>0,bc=(net|(~mi>>>0))>>>0;
 const C={mask:fromI(mi),net:fromI(net),bc:fromI(bc),first:fromI(net+1),last:fromI(bc-1)};
 const un=pN(g('n')),up=pN(g('p')),um=pIP(g('m')),mk=x=>x===0?0:(0xFFFFFFFF<<(32-x))>>>0;
 const rows=[],cnt=[0,0];
 const add=(l,u,ok,cor,why)=>{if(u==='')return;cnt[ok?0:1]++;rows.push(`<li class="${ok?'cok':'cbad'}"><b>${ok?'✅':'❌'} ${l}:</b> tu respuesta <code>${u}</code>${ok?'':` · correcto: <code>${cor}</code><br><span class="leg">${why}</span>`}</li>`)};
 add('n',g('n'),un===n,n,un===null?'Debe ser un número entero.':un<n?`Con n = ${un} solo hay 2<sup>${un}</sup> − 2 = ${2**un-2} hosts y necesitas ${h}.`:`Con n = ${un} llegas, pero no es el mínimo: con n = ${n} ya hay ${2**n-2} hosts (≥ ${h}) y con ${n-1} solo ${2**(n-1)-2}.`);
 add('Prefijo',g('p'),up===p,'/'+p,un!==null&&un!==n&&up===32-un?'Es coherente con tu n, pero arrastras el error del paso 1.':`Prefijo = 32 − n = 32 − ${n} = ${p}.`);
 add('Máscara',g('m'),!!um&&ipS(um)===ipS(C.mask),ipS(C.mask),um&&up!==null&&up<=32&&toI(um)===mk(up)&&up!==p?'Coincide con tu prefijo, así que el fallo viene de antes.':`Debe tener ${p} unos y ${n} ceros: ${bin(C.mask)}.`);
 add('Dirección de red',g('r'),eqIP(g('r'),C.net),ipS(C.net),`AND de la IP con la máscara /${p}: los ${n} bits de host pasan a 0.`);
 add('Broadcast',g('b'),eqIP(g('b'),C.bc),ipS(C.bc),`Mantén los bits de red y pon a 1 los últimos ${n} bits (red + ${2**n-1}).`);
 add('Primer host',g('f'),eqIP(g('f'),C.first),ipS(C.first),eqIP(g('f'),C.net)?'La primera dirección es la de red y no se asigna a ningún equipo: el primer host es red + 1.':'Primer host = dirección de red + 1.');
 add('Último host',g('l'),eqIP(g('l'),C.last),ipS(C.last),eqIP(g('l'),C.bc)?'La última dirección es la de broadcast y no se asigna: el último host es broadcast − 1.':'Último host = broadcast − 1.');
 const tot=cnt[0]+cnt[1];
 out.innerHTML=(tot?`<h2>Resultado: ${cnt[0]} de ${tot} correctas</h2><ul>${rows.join('')}</ul>`:'<p class="msg bad">No has rellenado ninguna respuesta.</p>')+`<div class="sol"><b>Solución completa</b><br>n = ${n} · /${p} · máscara ${ipS(C.mask)}${strip(C.mask,p)}${strip(C.net,p)}${strip(C.bc,p)}${LEG}Red ${ipS(C.net)} · Broadcast ${ipS(C.bc)} · Hosts ${ipS(C.first)} – ${ipS(C.last)} (${2**n-2} útiles)</div>`;
}
function check(){
  const i=S.i,s=ST[i],v={};
  s.f.forEach(f=>v[f.id]=document.getElementById('in-'+f.id).value);
  S.vals[i]=v;
  if(s.f.some(f=>!v[f.id].trim())){S.msg='Rellena todos los campos antes de comprobar.';render();return}
  if(s.ok(v)){S.res[i]=S.hints[i].length===0?'perfect':'help';S.msg='';}
  else if(S.hints[i].length>=3&&S.tries[i]>=3){S.res[i]='rev';S.msg='';}
  else{S.tries[i]++;if(S.hints[i].length<3)S.hints[i].push(s.hs[S.hints[i].length](v));S.msg=S.tries[i]>=3?'No es correcto. Última oportunidad: si fallas otra vez verás la solución.':'No es correcto. Revisa las pistas e inténtalo de nuevo.';}
  render();
}
render();
</script>
